<style>

  --muted: #a69eb8;
  --accent: #ecbc46;

  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

main { max-width: 960px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-size: 18px; letter-spacing: 0.08em; color: var(--accent); margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; background: #000; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--muted); font-size: 14px; }
.bar span { display: inline-flex; gap: 6px; align-items: center; }
kbd { font-family: var(--display); font-size: 9px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 4px 6px; }
button { font: inherit; }
.toggles { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.toggles button { font-family: var(--display); font-size: 9px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.toggles button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; touch-action: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; }
.dpad button:nth-child(1) { grid-area: 1 / 2; } .dpad button:nth-child(2) { grid-area: 2 / 1; }
.dpad button:nth-child(3) { grid-area: 2 / 3; } .dpad button:nth-child(4) { grid-area: 3 / 2; }
.abtn { display: flex; gap: 12px; align-items: center; }
.pad button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; font-family: var(--display); font-size: 12px; touch-action: none; }
.dpad button { width: 54px; height: 54px; }
.abtn button { width: 64px; height: 64px; border-radius: 50%; }
.abtn button[data-k="ok"] { background: #2e5ea6; }
@media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
@media (max-width: 480px) { h1 { font-size: 14px; } }
</style>

<main>
  <header>
    <h1>ZERO CLASS</h1>
    <p>Um campo, um lago, uma vila e slimes na grama alta.</p>
  </header>
  <div class="screen"><canvas id="game" width="960" height="640" tabindex="0" aria-label="Tela do jogo"></canvas></div>
  <div class="bar">
    <span class="keys"><kbd>↑↓←→</kbd> andar</span>
    <span class="keys"><kbd>Z</kbd><kbd>Enter</kbd> confirmar / falar</span>
    <span class="keys"><kbd>X</kbd><kbd>Esc</kbd> voltar / menu</span>
    <span class="toggles"><button id="musica" type="button">MÚSICA: LIGADA</button><button id="som" type="button">EFEITOS: LIGADOS</button></span>
  </div>
  <div class="pad" aria-hidden="true">
    <div class="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
    <div class="abtn"><button data-k="back">B</button><button data-k="ok">A</button></div>
  </div>
</main>

(() => {

function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; }
function recolor(img, map) {
  const [c, x] = canvasOf(img.width, img.height); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;

}

}

// ------------------------------------------------------------ entrada
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Enter: "ok", Space: "ok", KeyZ: "ok", Escape: "back", KeyX: "back", Backspace: "back" };

function press(k) { if (!held.has(k)) pressed.add(k); held.add(k); unlockAudio(); }

addEventListener("keydown", e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); press(k); });
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) release(k); });
addEventListener("blur", () => held.clear());
document.querySelectorAll(".pad button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); press(k); });

const hit = k => pressed.has(k);

// ------------------------------------------------------------ som (sintetizado)
let AC = null, muted = false, musicOff = false;
try { muted = localStorage.getItem("verdelume-mudo") === "1"; musicOff = localStorage.getItem("verdelume-sem-musica") === "1"; } catch (e) {}
const somBtn = document.getElementById("som"), musBtn = document.getElementById("musica");
function updSom() { somBtn.textContent = muted ? "EFEITOS: DESLIGADOS" : "EFEITOS: LIGADOS"; musBtn.textContent = musicOff ? "MÚSICA: DESLIGADA" : "MÚSICA: LIGADA"; }
updSom();
somBtn.addEventListener("click", () => { unlockAudio(); muted = !muted; updSom(); try { localStorage.setItem("verdelume-mudo", muted ? "1" : "0"); } catch (e) {} cv.focus(); });

});
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (AC && wantedSong) startSong(wantedSong); }
  if (AC && AC.state === "suspended" && !document.hidden) AC.resume();
}
document.addEventListener("visibilitychange", () => { if (!AC) return; document.hidden ? AC.suspend() : AC.resume(); });

// ------------------------------------------------------------ música (sequenciador chiptune, composições originais)
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function freq(n) { const m = /^([A-G])([#b]?)(\d)$/.exec(n); const s = NOTE[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0); return 440 * Math.pow(2, (12 * (+m[3] + 1) + s - 69) / 12); }
function seq(str) {
  const idx = {}; let t = 0;
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === "|") continue;
    const [n, l] = tok.split(":"), len = +(l || 1);
    if (n !== "r") (idx[t] = idx[t] || []).push({ f: freq(n), len });
    t += len;
  }
  return { idx, len: t };
}
const SONGS = {
  // campo: Sol maior, andamento tranquilo
  field: { bpm: 112, drums: "k...h...s...h...", dvol: 0.5, tracks: [
    { wave: "square", vol: 0.026, s: seq(`G4:2 B4:2 D5:3 B4:1 | C5:2 E5:2 D5:4 | B4:2 G4:2 A4:2 B4:2 | A4:6 r:2 |
      G4:2 B4:2 D5:3 E5:1 | F#5:2 E5:2 D5:4 | C5:2 B4:2 A4:2 F#4:2 | G4:6 r:2 |
      E5:2 D5:2 B4:2 G4:2 | C5:3 B4:1 A4:4 | D5:2 C5:2 A4:2 F#4:2 | G4:2 A4:2 B4:4 |
      E5:2 D5:2 B4:2 G4:2 | C5:2 E5:2 G5:4 | F#5:2 E5:2 D5:2 F#5:2 | G5:6 r:2`) },
    { wave: "triangle", vol: 0.09, s: seq(`G2:2 D3:2 G2:2 D3:2 | C3:2 G3:2 C3:2 G3:2 | E2:2 B2:2 E2:2 B2:2 | D3:2 A2:2 D3:2 A2:2 |
      G2:2 D3:2 G2:2 D3:2 | D3:2 A2:2 D3:2 A2:2 | C3:2 G2:2 D3:2 A2:2 | G2:2 D3:2 G2:4 |
      E3:2 B2:2 E3:2 B2:2 | A2:2 E3:2 A2:2 E3:2 | D3:2 A2:2 D3:2 A2:2 | G2:2 D3:2 G2:2 D3:2 |
      C3:2 G2:2 C3:2 G2:2 | A2:2 E3:2 A2:2 E3:2 | D3:2 A2:2 D3:2 F#3:2 | G2:6 r:2`) },
  ] },
  // vila: Fá maior, calmo, sem bateria
  village: { bpm: 92, tracks: [
    { wave: "triangle", vol: 0.1, s: seq(`F4:2 A4:2 C5:2 A4:2 | Bb4:3 A4:1 G4:4 | E4:2 G4:2 Bb4:2 G4:2 | A4:3 G4:1 F4:4 |
      D5:2 C5:2 Bb4:2 A4:2 | G4:2 A4:2 Bb4:4 | A4:2 G4:2 E4:2 G4:2 | F4:6 r:2`) },
    { wave: "square", vol: 0.012, s: seq(`r:2 C5:1 A4:1 r:2 C5:1 A4:1 | r:2 D5:1 Bb4:1 r:2 C5:1 Bb4:1 | r:2 C5:1 G4:1 r:2 Bb4:1 G4:1 | r:2 C5:1 A4:1 r:2 A4:1 F4:1 |
      r:2 D5:1 Bb4:1 r:2 D5:1 Bb4:1 | r:2 D5:1 Bb4:1 r:2 D5:1 G4:1 | r:2 C5:1 G4:1 r:2 Bb4:1 E4:1 | r:2 C5:1 A4:1 r:4`) },
    { wave: "triangle", vol: 0.07, s: seq(`F3:4 C3:4 | G3:4 C3:4 | C3:4 G3:4 | F3:4 C3:4 | Bb2:4 F3:4 | G3:4 Bb2:4 | C3:4 G3:4 | F3:8`) },
  ] },
  // batalha: Lá menor, rápido
  battle: { bpm: 152, drums: "k.hsk.hskkhsk.hs", dvol: 1, tracks: [
    { wave: "square", vol: 0.03, s: seq(`A4:2 C5:2 E5:2 A5:2 | G5:1 F5:1 E5:2 D5:2 E5:2 | F5:3 E5:1 D5:2 C5:2 | D5:3 C5:1 B4:2 G4:2 |
      A4:2 C5:2 E5:2 A5:2 | B5:1 A5:1 G5:2 E5:2 G5:2 | A5:2 G5:1 F5:1 E5:2 D5:2 | E5:4 G#4:4`) },
    { wave: "triangle", vol: 0.1, s: seq(`A2 A3 A2 A3 A2 A3 A2 A3 | A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 F2 F3 F2 F3 | G2 G3 G2 G3 G2 G3 G2 G3 |
      A2 A3 A2 A3 A2 A3 A2 A3 | A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 F2 F3 F2 F3 | E2 E3 E2 E3 E2 E3 E2 E3`) },
    { wave: "square", vol: 0.012, s: seq(`r:2 E4 A4 r:2 E4 A4 | r:2 E4 A4 r:2 E4 A4 | r:2 F4 A4 r:2 F4 C5 | r:2 G4 B4 r:2 G4 D5 |
      r:2 E4 A4 r:2 E4 A4 | r:2 E4 A4 r:2 E4 B4 | r:2 F4 A4 r:2 F4 C5 | r:2 E4 G#4 r:2 E4 B4`) },

};
let wantedSong = null, songName = null, song = null, mGain = null, nextT = 0, stepI = 0, seqTimer = null, NOISE = null;
function playMusic(name) { wantedSong = name; if (AC && !musicOff && songName !== name) startSong(name); }
function stopMusic() { wantedSong = null; stopSong(); }
function stopSong() {
  if (seqTimer) clearInterval(seqTimer); seqTimer = null;
  if (mGain && AC) { const g = mGain; g.gain.setTargetAtTime(0, AC.currentTime, 0.06); setTimeout(() => g.disconnect(), 500); }
  mGain = null; songName = null; song = null;
}
function startSong(name) {
  stopSong(); if (!AC || musicOff || !SONGS[name]) return;
  song = SONGS[name]; songName = name; stepI = 0;
  mGain = AC.createGain(); mGain.gain.value = 1; mGain.connect(AC.destination);
  nextT = AC.currentTime + 0.08; seqTimer = setInterval(schedule, 25);
}
function schedule() {
  if (!song || !AC) return;
  const sd = 60 / song.bpm / 2;
  if (nextT < AC.currentTime - 0.5) nextT = AC.currentTime + 0.05; // voltou de aba oculta: não despeja notas atrasadas
  while (nextT < AC.currentTime + 0.12) {
    for (const tr of song.tracks) {
      const evs = tr.s.idx[stepI % tr.s.len];
      if (evs) for (const e of evs) mnote(tr, e, nextT, sd);
    }
    if (song.drums) mdrum(song.drums[stepI % song.drums.length], nextT, song.dvol || 1);
    nextT += sd; stepI++;
  }
}
function mnote(tr, e, t, sd) {
  const o = AC.createOscillator(), g = AC.createGain(), end = t + e.len * sd * 0.92;
  o.type = tr.wave; o.frequency.setValueAtTime(e.f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(tr.vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(tr.vol * 0.55, t + Math.min(0.25, e.len * sd * 0.6));
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  o.connect(g); g.connect(mGain); o.start(t); o.stop(end + 0.02);
}
function mdrum(ch, t, v) {
  if (ch === ".") return;
  if (!NOISE) { const len = AC.sampleRate * 0.3; NOISE = AC.createBuffer(1, len, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
  if (ch === "k") {

    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.14 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(mGain); o.start(t); o.stop(t + 0.16); return;
  }

  s.buffer = NOISE; f.type = "highpass"; f.frequency.value = ch === "h" ? 7000 : 1500;

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

function tone(f, dur, { type = "square", vol = 0.05, at = 0, to = null } = {}) {

  if (muted || !AC) return;

  s.connect(g); g.connect(AC.destination); s.start(AC.currentTime + at);
}

// ------------------------------------------------------------ dados do jogo

function win(x, y, w, h) {
  ctx.fillStyle = C.ol; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, "#3a68bc"); g.addColorStop(1, "#16285c");
  ctx.fillStyle = g; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.strokeStyle = C.wh; ctx.lineWidth = 1; ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
}
function txt(s, x, y, col = C.wh, align = "left") {
  ctx.font = FONT; ctx.textBaseline = "top"; ctx.textAlign = align;
  ctx.fillStyle = C.ol; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function hand(x, y) {
  const b = Math.floor(frame / 15) % 2;
  x += b;
  ctx.fillStyle = C.ol; ctx.fillRect(x - 1, y - 1, 12, 9);
  ctx.fillStyle = C.wh; ctx.fillRect(x, y, 7, 7); ctx.fillRect(x + 7, y + 2, 3, 3);
  ctx.fillStyle = C.s2; ctx.fillRect(x, y + 5, 7, 2);
}
function bar(x, y, w, v, col) {
  ctx.fillStyle = C.ol; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, Math.round((w - 2) * clamp(v, 0, 1)), 3);
}
function hpColor(m) { return m.hp === 0 ? C.r1 : m.hp < m.maxhp / 4 ? C.au : C.wh; }
function wrap(s, max) {
  const out = []; let line = "";
  for (const w of s.split(" ")) { if ((line + " " + w).trim().length > max) { out.push(line); line = w; } else line = (line + " " + w).trim(); }
  if (line) out.push(line); return out;
}

  return [mw <= VW ? -Math.floor((VW - mw) / 2) : clamp(Math.round(P.x + 16 - VW / 2), 0, mw - VW),
          mh <= VH ? -Math.floor((VH - mh) / 2) : clamp(Math.round(P.y + 16 - VH / 2), 0, mh - VH)];
}
function placePlayer() { P.x = G.tx * TS; P.y = G.ty * TS; P.moving = false; }
function say(lines, after, choice) {
  const pages = []; for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
  dialog = { pages, page: 0, after, choice: choice ? { ...choice, idx: 0 } : null };
}

const DIRV = [[0, 1], [-1, 0], [1, 0], [0, -1]];

function updateDialog() {
  const d = dialog, last = d.page === d.pages.length - 1;
  if (last && d.choice) {
    if (hit("up") || hit("down")) { d.choice.idx ^= 1; SFX.cursor(); }
    if (hit("back")) { SFX.back(); dialog = null; d.choice.cb(false); return; }
    if (hit("ok")) { SFX.ok(); dialog = null; d.choice.cb(d.choice.idx === 0); }
    return;

  if (hit("ok") || hit("back")) { SFX.ok(); if (!last) { d.page++; return; } dialog = null; d.after && d.after(); }
}
function updateField() {
  if (sleepT > 0) {
    if (--sleepT === 0) { playMusic(MAP.def.music); say(["Vocês acordam descansados.", "HP e MP restaurados. Progresso salvo."]); }
    return;
  }
  if (dialog) return updateDialog();
  if (fmenu) return updateFieldMenu();
  if (shop) return updateShop();
  updateNpcs();
  if (P.moving) {
    P.prog += 2; P.anim++;
    P.x = P.fx * TS + (G.tx - P.fx) * P.prog; P.y = P.fy * TS + (G.ty - P.fy) * P.prog;
    if (P.prog >= TS) { P.moving = false; P.x = G.tx * TS; P.y = G.ty * TS; onStep(); }
    if (P.moving || MODE !== "field") return;
  }
  if (hit("back")) { SFX.ok(); fmenu = { stage: "main", idx: 0, tgt: 0 }; return; }
  if (hit("ok")) { interact(); return; }
  const dirs = [["down", 0], ["left", 1], ["right", 2], ["up", 3]];
  for (const [k, d] of dirs) if (held.has(k)) {
    G.dir = d; const [dx, dy] = DIRV[d], nx = G.tx + dx, ny = G.ty + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) {
      const ex = MAP.def.exits.find(e => e.tx === G.tx && e.ty === G.ty && e.dir === d);
      if (ex) { startWarp(ex); return; }
      if (frame % 16 === 0) SFX.bump();
    } else if (d === 3 && doorAt(nx, ny)) { enterDoor(doorAt(nx, ny)); return;
    } else if (!blocked[ny][nx]) {
      P.fx = G.tx; P.fy = G.ty; G.tx = nx; G.ty = ny; P.prog = 0; P.moving = true;
    } else if (frame % 16 === 0) SFX.bump();

}
function updateNpcs() {
  for (const n of objs) {
    if (n.kind !== "npc") continue;
    if (n.moving) {
      n.prog++; n.anim++;
      n.x = n.fx * TS + (n.tx - n.fx) * n.prog; n.y = n.fy * TS + (n.ty - n.fy) * n.prog;
      if (n.prog >= TS) { n.moving = false; blocked[n.fy][n.fx] = false; n.x = n.tx * TS; n.y = n.ty * TS; }
      continue;
    }
    if (!n.wander || --n.timer > 0) continue;
    n.timer = ri(80, 220);
    const d = ri(0, 3), [dx, dy] = DIRV[d], nx = n.tx + dx, ny = n.ty + dy; n.dir = d;
    if (Math.abs(nx - n.home[0]) > n.wander || Math.abs(ny - n.home[1]) > n.wander) continue;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H || blocked[ny][nx]) continue;
    if ((nx === G.tx && ny === G.ty) || (P.moving && nx === P.fx && ny === P.fy)) continue;
    blocked[ny][nx] = true; n.fx = n.tx; n.fy = n.ty; n.tx = nx; n.ty = ny; n.prog = 0; n.moving = true;
  }
}
function startWarp(ex) { warp = { ex, t: 0 }; MODE = "warp"; }

function applyItem(k, m) {

function drawField() {

function diamond(x, y) {

  const pts = (s) => { ctx.beginPath(); ctx.moveTo(x, y - 12 - s); ctx.lineTo(x + 7 + s, y); ctx.lineTo(x, y + 12 + s); ctx.lineTo(x - 7 - s, y); ctx.closePath(); };

  ctx.fillStyle = C.w2; pts(0); ctx.fill();

  ctx.fillStyle = C.wh; ctx.fillRect(x - 3, y - 5, 2, 3);

const ESLOTS = [[96, 128], [176, 104], [150, 184], [64, 196]];
function makeGroup() {
  const lv = G.party.reduce((s, m) => s + m.lv, 0) / 3;
  const n = clamp(ri(1, 2) + (Math.random() < 0.25 + lv * 0.08 ? 1 : 0) + (lv >= 4 && Math.random() < 0.3 ? 1 : 0), 1, 4);
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    out.push(r < 0.55 - lv * 0.05 ? "verde" : r < 0.85 - lv * 0.03 ? "azul" : "rubro");
  }
  return out;
}
function startBattle() {
  const types = makeGroup();
  const counts = {};

      txt(sp.name, 30, y, ok ? C.wh : C.grey); txt(String(sp.mp), 150, y, ok ? C.w3 : C.grey, "right");
      if (M.stage === "magic" && M.idx === i) hand(12, y);
    });
    txt("MP", 150, top + 86, C.s2, "right");
  } else if (M && (M.stage === "item" || M.stage === "target" && M.prev === "item")) {
    ITEM_ORDER.forEach((k, i) => {
      const n = G.inv[k] || 0, y = top + 14 + i * 17;
      txt(ITEMS[k].name, 30, y, n ? C.wh : C.grey); txt("x" + n, 150, y, n ? C.wh : C.grey, "right");
      if (M.stage === "item" && M.idx === i) hand(12, y);
    });
    wrap(ITEMS[ITEM_ORDER[Math.min(M.idx, 2)]].desc, 17).forEach((l, i) => txt(l, 14, top + 68 + i * 12, C.w3));
  } else {
    alive(B.enemies).forEach((e, i) => txt(e.name, 16, top + 14 + i * 17));
  }
  win(168, top, VW - 168, VH - top);
  txt("HP", 290, top + 10, C.s2); txt("MP", 364, top + 10, C.s2); txt("TEMPO", 404, top + 10, C.s2);
  G.party.forEach((m, i) => {
    const y = top + 28 + i * 22, act = M && M.actor === m;
    txt(m.name, 186, y, act ? C.au : m.hp ? C.wh : C.r1);
    txt(`${m.hp}/${m.maxhp}`, 340, y, hpColor(m), "right");
    txt(String(m.mp), 384, y, C.wh, "right");
    const full = m.atb >= 100;
    bar(404, y + 1, 60, m.hp ? m.atb / 100 : 0, full ? (frame % 20 < 10 ? C.au : C.wh) : C.w3);
  });
  // cursor de alvo
  if (M && M.stage === "target") {
    const list = M.side === "party" ? (M.allowKO ? G.party : alive(G.party)) : alive(B.enemies);
    const t = list[M.t];
    if (t) {
      if (M.side === "enemy") { hand(t.x - 46, t.y - 26); txt(t.name, 16, top - 18, C.wh); }
      else { const [x, y] = partyPos(G.party.indexOf(t)); hand(x - 46, y - 36); }
    }
  }
  if (B.msg) { const w = Math.max(140, B.msg.text.length * 8 + 40); win((VW - w) / 2, 8, w, 28); txt(B.msg.text, VW / 2, 18, C.wh, "center"); }
  if (B.phase === "end") {
    const h = 40 + B.lines.length * 18;
    win(60, 60, VW - 120, h);
    if (B.title) txt(B.title, VW / 2, 74, C.au, "center");
    B.lines.forEach((l, i) => txt(l, VW / 2, (B.title ? 94 : 80) + i * 18, C.wh, "center"));
    if (Math.floor(frame / 20) % 2) txt("▼", VW - 80, 60 + h - 18, C.au);
  }
  if (B.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${B.fade / 30})`; ctx.fillRect(0, 0, VW, VH); }
}

// ------------------------------------------------------------ título
function updateTitle() {
  const n = hasSave ? 2 : 1;
  if (hit("up") || hit("down")) { titleIdx = (titleIdx + 1) % n; SFX.cursor(); }
  if (hit("ok")) {
    SFX.ok();
    const s = hasSave && titleIdx === 0 ? loadSave() : null;
    G = s || newGame(); if (!s) save();
    useMap(MAPS[G.map || "field"]); placePlayer(); MODE = "field"; fadeIn = 40; playMusic(MAP.def.music);
    if (!s) say(["Lia, Davi e Nina chegam ao santuário de Verdelume.", "Toque o cristal para descansar e salvar.", "A vila fica no fim da estrada, a leste.", "Esc / X abre o menu de itens."]);
  }
}
function drawTitle() {
  const ox = (frame * 0.25) % (W * TS - VW);
  ctx.drawImage(MAPS.field.canv[Math.floor(frame / 32) % 2], ox, 280, VW, VH, 0, 0, VW, VH);
  ctx.fillStyle = "rgba(20,18,27,0.55)"; ctx.fillRect(0, 0, VW, VH);
  ctx.font = '24px "Press Start 2P", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = C.ol; ctx.fillText("ZERO CLASS", VW / 2 + 3, 83); ctx.fillStyle = C.au; ctx.fillText("ZERO CLASS", VW / 2, 80);
  txt("um pequeno RPG de campo", VW / 2, 118, C.w3, "center");
  [0, 1, 2].forEach(i => drawMember(i, 0, [0, 1, 2, 1][Math.floor(frame / 10 + i) % 4], VW / 2 - 102 + i * 70, 130));
  ctx.drawImage(IMG.slimes, Math.floor(frame / 22) % 2 * 128, 0, 128, 128, 40, 132, 64, 64);
  ctx.drawImage(IMG.slimes, Math.floor(frame / 22 + 1) % 2 * 128, 128, 128, 128, VW - 104, 132, 64, 64);
  const opts = hasSave ? ["Continuar", "Novo jogo"] : ["Novo jogo"];
  win(VW / 2 - 80, 204, 160, 18 + opts.length * 18);
  opts.forEach((o, i) => { txt(o, VW / 2 - 46, 216 + i * 18); if (titleIdx === i) hand(VW / 2 - 64, 216 + i * 18); });
  txt("Z / Enter para começar", VW / 2, VH - 24, C.s2, "center");
}

// ------------------------------------------------------------ loop
function update() {
  frame++;
  if (MODE === "title") updateTitle();
  else if (MODE === "field") updateField();
  else if (MODE === "trans") updateTrans();
  else if (MODE === "warp") updateWarp();
  else if (MODE === "battle") updateBattle();
  if (toast) { toast.t++; if (toast.t > 120) toast = null; }
  pressed.clear();
}
function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); // mundo em 480x320 lógico, tela real 960x640
  ctx.imageSmoothingEnabled = false;
  if (MODE === "title") drawTitle();
  else if (MODE === "field") drawField();
  else if (MODE === "trans") drawTrans();
  else if (MODE === "warp") { drawField(); ctx.fillStyle = `rgba(0,0,0,${warp ? warp.t / 20 : 1})`; ctx.fillRect(0, 0, VW, VH); }
  else if (MODE === "battle") drawBattle();
  if (fadeIn > 0 && MODE === "field") { ctx.fillStyle = `rgba(0,0,0,${fadeIn / 40})`; ctx.fillRect(0, 0, VW, VH); fadeIn--; }
}
let last = 0, acc = 0;
function loop(ts) {
  acc += Math.min(100, ts - (last || ts)); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}

function drawInteriorTile(x, rows, tx, ty) {
  const ch = rows[ty][tx], at = (a, b) => (rows[b] || "")[a] || "#";
  const put = (c, r) => x.drawImage(IMG.interior, c * TS, r * TS, TS, TS, tx * TS, ty * TS, TS, TS);
  if (ch === ".") put(hash(tx, ty, 21) < 0.5 ? 0 : 1, 0);
  else if (ch === "W") put(2, 0);
  else if (ch === "w") put(3, 0);
  else if (ch === "D") put(5, 0);
  else if (ch === "r") {
    const col = at(tx - 1, ty) !== "r" ? 0 : at(tx + 1, ty) !== "r" ? 2 : 1, row = at(tx, ty - 1) !== "r" ? 0 : at(tx, ty + 1) !== "r" ? 2 : 1;
    const i = row * 3 + col; put(1, 0); put(i % 8, 1 + (i >> 3));
  } else {
    put(4, 0); x.fillStyle = C.d0;
    const open = c => c !== "#";
    if (open(at(tx + 1, ty)) && at(tx + 1, ty) !== "W" && at(tx + 1, ty) !== "w") x.fillRect(tx * TS + 28, ty * TS, 4, TS);
    if (open(at(tx - 1, ty)) && at(tx - 1, ty) !== "W" && at(tx - 1, ty) !== "w") x.fillRect(tx * TS, ty * TS, 4, TS);
    if (open(at(tx, ty - 1)) && at(tx, ty - 1) !== "W") x.fillRect(tx * TS, ty * TS, TS, 4);
    if (at(tx, ty + 1) === "W" || at(tx, ty + 1) === "w") x.fillRect(tx * TS, ty * TS + 28, TS, 4);
  }
}
async function start(hot) {
  const [tiles, props, slimes, village, interior, furniture, heroes, npcs] = await Promise.all([SRC.tiles, SRC.props, SRC.slimes, SRC.village, SRC.interior, SRC.furniture, SRC.heroes, SRC.npcs].map(loadImg));
  H128 = heroes; H128_W = silhouette(heroes, C.wh); NPC128 = npcs;
  IMG = { tiles, props, slimes, village, interior, furniture };
  SL_W = silhouette(slimes, C.wh);
  for (const def of [VILLAGE, FIELD, ...INTERIORS]) {
    const m = buildMap(def); useMap(m);
    for (let f = 0; f < 2; f++) {
      const [c, x] = canvasOf(W * TS, H * TS);
      for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
        if (def.rows) { drawInteriorTile(x, def.rows, tx, ty); continue; }
        const [sx, sy] = tileSrc(tx, ty, f); x.drawImage(tiles, sx * TS, sy * TS, TS, TS, tx * TS, ty * TS, TS, TS);
      }
      m.canv.push(c);
    }
  }
  wantedSong = "field";
  const [bg, bx] = canvasOf(VW, 216);
  const sky = bx.createLinearGradient(0, 0, 0, 70); sky.addColorStop(0, "#488cd2"); sky.addColorStop(1, "#bae4f4");
  bx.fillStyle = sky; bx.fillRect(0, 0, VW, 70);
  for (let x = 0; x < VW; x += 32) bx.drawImage(tiles, 0, 0, 32, 32, x, 60, 32, 32);
  for (let x = 0; x < VW; x += 32) for (let y = 60; y < 216; y += 32) bx.drawImage(tiles, (hash(x, y) < .7 ? 0 : hash(x, y) < .9 ? 1 : 7) * 32, 0, 32, 32, x, y, 32, 32);
  for (let i = 0; i < 12; i++) bx.drawImage(props, 0, 0, 64, 64, -20 + i * 44 + (i % 2) * 10, -2 - (i % 2) * 8, 64, 64);
  bx.fillStyle = "rgba(34,28,40,0.18)"; bx.fillRect(0, 190, VW, 26);
  BATTLE_BG = bg;
  hasSave = !!loadSave();
  if (hot && hot.G) { G = hot.G; useMap(MAPS[G.map || "field"]); MODE = "field"; placePlayer(); wantedSong = MAP.def.music; }
  try { await Promise.race([document.fonts.load(FONT), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  cv.focus({ preventScroll: true });
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(() => ({ G: MODE === "field" && G ? G : null }));
const boot = d => start(d || {});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
