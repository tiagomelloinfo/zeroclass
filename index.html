<style>
/* Layout: uma única "tela de console" centralizada, com legenda de controles embaixo. Visual escuro fixo, de propósito. */
:root {
  --bg: #14121b;
  --panel: #1e1a2a;
  --line: #342d47;
  --fg: #ebe5d8;
  --muted: #a69eb8;
  --accent: #ecbc46;
  --display: "Press Start 2P", ui-monospace, monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 960px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-size: 18px; letter-spacing: 0.08em; color: var(--accent); margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; background: #000; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--muted); font-size: 14px; }
.bar span { display: inline-flex; gap: 6px; align-items: center; }
kbd { font-family: var(--display); font-size: 9px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 4px 6px; }
button { font: inherit; }
.toggles { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.toggles button { font-family: var(--display); font-size: 9px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.toggles button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; touch-action: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; }
.dpad button:nth-child(1) { grid-area: 1 / 2; } .dpad button:nth-child(2) { grid-area: 2 / 1; }
.dpad button:nth-child(3) { grid-area: 2 / 3; } .dpad button:nth-child(4) { grid-area: 3 / 2; }
.abtn { display: flex; gap: 12px; align-items: center; }
.pad button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; font-family: var(--display); font-size: 12px; touch-action: none; }
.dpad button { width: 54px; height: 54px; }
.abtn button { width: 64px; height: 64px; border-radius: 50%; }
.abtn button[data-k="ok"] { background: #2e5ea6; }
@media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
@media (max-width: 480px) { h1 { font-size: 14px; } }
</style>

<main>
  <header>
    <h1>ZERO CLASS</h1>
    <p>Um campo, um lago e slimes na grama alta.</p>
  </header>
  <div class="screen"><canvas id="game" width="960" height="640" tabindex="0" aria-label="Tela do jogo"></canvas></div>
  <div class="bar">
    <span class="keys"><kbd>↑↓←→</kbd> andar</span>
    <span class="keys"><kbd>Z</kbd><kbd>Enter</kbd> confirmar / falar</span>
    <span class="keys"><kbd>X</kbd><kbd>Esc</kbd> voltar / menu</span>
    <span class="toggles"><button id="musica" type="button">MÚSICA: LIGADA</button><button id="som" type="button">EFEITOS: LIGADOS</button></span>
  </div>
  <div class="pad" aria-hidden="true">
    <div class="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
    <div class="abtn"><button data-k="back">B</button><button data-k="ok">A</button></div>
  </div>
</main>

function hash(x, y, s = 0) {
  let n = (x * 374761393 + y * 668265263 + s * 982451653) >>> 0;

  return ((n ^ (n >>> 16)) & 0xffff) / 65535;
}

function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; }
function recolor(img, map) {
  const [c, x] = canvasOf(img.width, img.height); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    if (p[i + 3] < 200) continue;
    const to = map[p[i] + "," + p[i + 1] + "," + p[i + 2]];
    if (to) { p[i] = to[0]; p[i + 1] = to[1]; p[i + 2] = to[2]; }
  }
  x.putImageData(d, 0, 0); return c;
}

    const sh = e.dying >= 0 ? e.dying * 0.6 : 0;
    ctx.drawImage(img, f * 128, e.row * 128, 128, 128, e.x - 32, e.y - 60 + sh, 64, 64 - sh);
    ctx.restore();
    if (e.dying >= 0 && e.dying < 40 && e.dying % 3 === 0) burst(e.x, e.y - 20, 2, [C.wh, C.s2], { up: 0.6 });
  });
  // grupo
  G.party.forEach((m, i) => {
    const [x, y] = partyPos(i);
    const white = m.flash && Math.floor(m.flash / 2) % 2 === 0;
    if (m.hp <= 0) { drawPose(m.skin, 4, x - 32, y - 60, white); return; }
    const a = B.cur && B.cur.actor === m ? B.cur : null;
    const ready = B.menu && B.menu.actor === m;
    const ox = (m.ox || 0) + (ready ? -10 : 0);
    let pose = m.hp < m.maxhp / 4 ? 3 : 0, walk = -1;
    if (m.flash) pose = 3;
    if (B.phase === "end" && B.title === "Vitória!") pose = 2;
    if (a) {
      if (a.t < 10 || a.t > a.dur - 10) walk = [0, 2][Math.floor(a.t / 5) % 2];
      else pose = a.kind === "attack" ? 1 : (a.kind === "spell" || a.kind === "item") ? 2 : 0;
    }
    if (walk >= 0) drawMember(m.skin, 1, walk, x - 32 + ox, y - 60, white);
    else drawPose(m.skin, pose, x - 32 + ox, y - 60, white);
    if (m.def_) { ctx.fillStyle = C.w3; ctx.globalAlpha = 0.5; ctx.fillRect(x - 24 + ox, y - 44, 2, 34); ctx.globalAlpha = 1; }
    if (m.hp < m.maxhp / 4 && frame % 40 < 20) { ctx.fillStyle = C.au; ctx.fillRect(x + 10, y - 58, 2, 2); }
  });
  // efeitos
  const a = B.cur;
  if (a && a.slash && a.t >= 14 && a.t < 26) {
    const k = (a.t - 14) / 12, { x, y } = a.slash;
    ctx.strokeStyle = C.wh; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 18 + 4, y - 18); ctx.lineTo(x - 18 + 36 * k + 4, y - 18 + 36 * k); ctx.stroke();
    ctx.strokeStyle = C.au; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 18, y - 16); ctx.lineTo(x - 18 + 36 * k, y - 16 + 36 * k); ctx.stroke();
  }
  if (a && a.bolt && a.t >= 14 && a.t < 30) {
    alive(B.enemies).concat(B.enemies.filter(e => e.dying >= 0 && e.dying < 20)).forEach(e => {
      ctx.strokeStyle = (a.t % 4 < 2) ? C.au : C.wh; ctx.lineWidth = 3; ctx.beginPath();
      let px = e.x, py = 0; ctx.moveTo(px, py);
      for (let s = 1; s <= 6; s++) { px = e.x + (s < 6 ? ri(-8, 8) : 0); py = (e.y - 16) * s / 6; ctx.lineTo(px, py); }
      ctx.stroke();
    });
  }
  B.parts.forEach(p => { ctx.globalAlpha = clamp(p.life / 14, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
  ctx.globalAlpha = 1;
  B.pops.forEach(p => {
    const k = p.t < 10 ? -Math.sin(p.t / 10 * Math.PI) * 10 : 0;
    ctx.globalAlpha = p.t > 40 ? (50 - p.t) / 10 : 1; txt(p.text, p.x, p.y + k, p.col, "center"); ctx.globalAlpha = 1;
  });
  ctx.restore();
  if (B.flashScreen) { ctx.fillStyle = `rgba(244,240,230,${B.flashScreen / 16})`; ctx.fillRect(0, 0, VW, VH); }

  // janelas
  const top = 216;
  win(0, top, 168, VH - top);
  const M = B.menu;
  if (M && (M.stage === "cmd" || M.stage === "target" && (M.prev === "cmd"))) {
    CMDS.forEach((c, i) => { txt(c, 30, top + 14 + i * 17); if (M.stage === "cmd" && M.idx === i) hand(12, top + 14 + i * 17); });
  } else if (M && (M.stage === "magic" || M.stage === "target" && M.prev === "magic")) {
    SPELL_ORDER.filter(k => knows(M.actor, k)).forEach((k, i) => {
      const sp = SPELLS[k], ok = M.actor.mp >= sp.mp, y = top + 14 + i * 17;
      txt(sp.name, 30, y, ok ? C.wh : C.grey); txt(String(sp.mp), 150, y, ok ? C.w3 : C.grey, "right");
      if (M.stage === "magic" && M.idx === i) hand(12, y);
    });
    txt("MP", 150, top + 86, C.s2, "right");
  } else if (M && (M.stage === "item" || M.stage === "target" && M.prev === "item")) {
    ITEM_ORDER.forEach((k, i) => {
      const n = G.inv[k] || 0, y = top + 14 + i * 17;
      txt(ITEMS[k].name, 30, y, n ? C.wh : C.grey); txt("x" + n, 150, y, n ? C.wh : C.grey, "right");
      if (M.stage === "item" && M.idx === i) hand(12, y);
    });
    wrap(ITEMS[ITEM_ORDER[Math.min(M.idx, 2)]].desc, 17).forEach((l, i) => txt(l, 14, top + 68 + i * 12, C.w3));
  } else {
    alive(B.enemies).forEach((e, i) => txt(e.name, 16, top + 14 + i * 17));
  }
  win(168, top, VW - 168, VH - top);
  txt("HP", 290, top + 10, C.s2); txt("MP", 364, top + 10, C.s2); txt("TEMPO", 404, top + 10, C.s2);
  G.party.forEach((m, i) => {
    const y = top + 28 + i * 22, act = M && M.actor === m;
    txt(m.name, 186, y, act ? C.au : m.hp ? C.wh : C.r1);
    txt(`${m.hp}/${m.maxhp}`, 340, y, hpColor(m), "right");
    txt(String(m.mp), 384, y, C.wh, "right");
    const full = m.atb >= 100;
    bar(404, y + 1, 60, m.hp ? m.atb / 100 : 0, full ? (frame % 20 < 10 ? C.au : C.wh) : C.w3);
  });
  // cursor de alvo
  if (M && M.stage === "target") {
    const list = M.side === "party" ? (M.allowKO ? G.party : alive(G.party)) : alive(B.enemies);
    const t = list[M.t];
    if (t) {
      if (M.side === "enemy") { hand(t.x - 46, t.y - 26); txt(t.name, 16, top - 18, C.wh); }
      else { const [x, y] = partyPos(G.party.indexOf(t)); hand(x - 46, y - 36); }
    }
  }
  if (B.msg) { const w = Math.max(140, B.msg.text.length * 8 + 40); win((VW - w) / 2, 8, w, 28); txt(B.msg.text, VW / 2, 18, C.wh, "center"); }
  if (B.phase === "end") {
    const h = 40 + B.lines.length * 18;
    win(60, 60, VW - 120, h);
    if (B.title) txt(B.title, VW / 2, 74, C.au, "center");
    B.lines.forEach((l, i) => txt(l, VW / 2, (B.title ? 94 : 80) + i * 18, C.wh, "center"));
    if (Math.floor(frame / 20) % 2) txt("▼", VW - 80, 60 + h - 18, C.au);
  }
  if (B.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${B.fade / 30})`; ctx.fillRect(0, 0, VW, VH); }
}

// ------------------------------------------------------------ título
function updateTitle() {
  const n = hasSave ? 2 : 1;
  if (hit("up") || hit("down")) { titleIdx = (titleIdx + 1) % n; SFX.cursor(); }
  if (hit("ok")) {
    SFX.ok();
    const s = hasSave && titleIdx === 0 ? loadSave() : null;
    G = s || newGame();
    if (!MAPS[G.map || "field"]) { G.map = "field"; G.tx = 5; G.ty = 7; G.dir = 3; }
    save();
    useMap(MAPS[G.map || "field"]); placePlayer(); MODE = "field"; fadeIn = 40; playMusic(MAP.def.music);
    if (!s) say(["Lia, Davi e Nina chegam ao santuário de Verdelume.", "Toque o cristal para descansar e salvar.", "Esc / X abre o menu de itens."]);
  }
}
function drawTitle() {
  const ox = (frame * 0.25) % (W * TS - VW);
  ctx.drawImage(MAPS.field.canv[Math.floor(frame / 32) % 2], ox, 280, VW, VH, 0, 0, VW, VH);
  ctx.fillStyle = "rgba(20,18,27,0.55)"; ctx.fillRect(0, 0, VW, VH);
  ctx.font = '24px "Press Start 2P", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = C.ol; ctx.fillText("ZERO CLASS", VW / 2 + 3, 83); ctx.fillStyle = C.au; ctx.fillText("ZERO CLASS", VW / 2, 80);
  txt("um pequeno RPG de campo", VW / 2, 118, C.w3, "center");
  [0, 1, 2].forEach(i => drawMember(i, 0, [0, 1, 2, 1][Math.floor(frame / 10 + i) % 4], VW / 2 - 102 + i * 70, 130));
  ctx.drawImage(IMG.slimes, Math.floor(frame / 22) % 2 * 128, 0, 128, 128, 40, 132, 64, 64);
  ctx.drawImage(IMG.slimes, Math.floor(frame / 22 + 1) % 2 * 128, 128, 128, 128, VW - 104, 132, 64, 64);
  const opts = hasSave ? ["Continuar", "Novo jogo"] : ["Novo jogo"];
  win(VW / 2 - 80, 204, 160, 18 + opts.length * 18);
  opts.forEach((o, i) => { txt(o, VW / 2 - 46, 216 + i * 18); if (titleIdx === i) hand(VW / 2 - 64, 216 + i * 18); });
  txt("Z / Enter para começar", VW / 2, VH - 24, C.s2, "center");
}

// ------------------------------------------------------------ loop
function update() {
  frame++;
  if (MODE === "title") updateTitle();
  else if (MODE === "field") updateField();
  else if (MODE === "trans") updateTrans();
  else if (MODE === "warp") updateWarp();
  else if (MODE === "battle") updateBattle();
  if (toast) { toast.t++; if (toast.t > 120) toast = null; }
  pressed.clear();
}
function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); // mundo em 480x320 lógico, tela real 960x640
  ctx.imageSmoothingEnabled = false;
  if (MODE === "title") drawTitle();
  else if (MODE === "field") drawField();
  else if (MODE === "trans") drawTrans();
  else if (MODE === "warp") { drawField(); ctx.fillStyle = `rgba(0,0,0,${warp ? warp.t / 20 : 1})`; ctx.fillRect(0, 0, VW, VH); }
  else if (MODE === "battle") drawBattle();
  if (fadeIn > 0 && MODE === "field") { ctx.fillStyle = `rgba(0,0,0,${fadeIn / 40})`; ctx.fillRect(0, 0, VW, VH); fadeIn--; }
}
let last = 0, acc = 0;
function loop(ts) {
  acc += Math.min(100, ts - (last || ts)); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}

function drawInteriorTile(x, rows, tx, ty) {
  const ch = rows[ty][tx], at = (a, b) => (rows[b] || "")[a] || "#";
  const put = (c, r) => x.drawImage(IMG.interior, c * TS, r * TS, TS, TS, tx * TS, ty * TS, TS, TS);
  if (ch === ".") put(hash(tx, ty, 21) < 0.5 ? 0 : 1, 0);
  else if (ch === "W") put(2, 0);
  else if (ch === "w") put(3, 0);
  else if (ch === "D") put(5, 0);
  else if (ch === "r") {
    const col = at(tx - 1, ty) !== "r" ? 0 : at(tx + 1, ty) !== "r" ? 2 : 1, row = at(tx, ty - 1) !== "r" ? 0 : at(tx, ty + 1) !== "r" ? 2 : 1;
    const i = row * 3 + col; put(1, 0); put(i % 8, 1 + (i >> 3));
  } else {
    put(4, 0); x.fillStyle = C.d0;
    const open = c => c !== "#";
    if (open(at(tx + 1, ty)) && at(tx + 1, ty) !== "W" && at(tx + 1, ty) !== "w") x.fillRect(tx * TS + 28, ty * TS, 4, TS);
    if (open(at(tx - 1, ty)) && at(tx - 1, ty) !== "W" && at(tx - 1, ty) !== "w") x.fillRect(tx * TS, ty * TS, 4, TS);
    if (open(at(tx, ty - 1)) && at(tx, ty - 1) !== "W") x.fillRect(tx * TS, ty * TS, TS, 4);
    if (at(tx, ty + 1) === "W" || at(tx, ty + 1) === "w") x.fillRect(tx * TS, ty * TS + 28, TS, 4);
  }
}
async function start(hot) {
  const [tiles, props, slimes, village, interior, furniture, heroes, npcs] = await Promise.all([SRC.tiles, SRC.props, SRC.slimes, SRC.village, SRC.interior, SRC.furniture, SRC.heroes, SRC.npcs].map(loadImg));
  H128 = heroes; H128_W = silhouette(heroes, C.wh); NPC128 = npcs;
  IMG = { tiles, props, slimes, village, interior, furniture };
  SL_W = silhouette(slimes, C.wh);
  for (const def of [FIELD]) {
    const m = buildMap(def); useMap(m);
    for (let f = 0; f < 2; f++) {
      const [c, x] = canvasOf(W * TS, H * TS);
      for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
        if (def.rows) { drawInteriorTile(x, def.rows, tx, ty); continue; }
        const [sx, sy] = tileSrc(tx, ty, f); x.drawImage(tiles, sx * TS, sy * TS, TS, TS, tx * TS, ty * TS, TS, TS);
      }
      m.canv.push(c);
    }
  }
  wantedSong = "field";
  const [bg, bx] = canvasOf(VW, 216);
  const sky = bx.createLinearGradient(0, 0, 0, 70); sky.addColorStop(0, "#488cd2"); sky.addColorStop(1, "#bae4f4");
  bx.fillStyle = sky; bx.fillRect(0, 0, VW, 70);
  for (let x = 0; x < VW; x += 32) bx.drawImage(tiles, 0, 0, 32, 32, x, 60, 32, 32);
  for (let x = 0; x < VW; x += 32) for (let y = 60; y < 216; y += 32) bx.drawImage(tiles, (hash(x, y) < .7 ? 0 : hash(x, y) < .9 ? 1 : 7) * 32, 0, 32, 32, x, y, 32, 32);
  for (let i = 0; i < 12; i++) bx.drawImage(props, 0, 0, 64, 64, -20 + i * 44 + (i % 2) * 10, -2 - (i % 2) * 8, 64, 64);
  bx.fillStyle = "rgba(34,28,40,0.18)"; bx.fillRect(0, 190, VW, 26);
  BATTLE_BG = bg;
  hasSave = !!loadSave();
  if (hot && hot.G && MAPS[hot.G.map || "field"]) { G = hot.G; useMap(MAPS[G.map || "field"]); MODE = "field"; placePlayer(); wantedSong = MAP.def.music; }
  try { await Promise.race([document.fonts.load(FONT), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  cv.focus({ preventScroll: true });
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(() => ({ G: MODE === "field" && G ? G : null }));
const boot = d => start(d || {});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
